<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bfe4fe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="穿什么">
<title>幼儿园穿什么</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2f86d0; --blue-d:#1f6cb0; --blue-l:#e8f5ff; --chip:#4aa3e0;
    --ink:#33506a; --ink-soft:#6b88a3; --line:#d8ecfb; --card:#fff;
    --warn:#ffb84d; --shadow:0 6px 18px rgba(70,130,190,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#bfe4fe 0%,#e3f4ff 40%,#eef9ff 100%);
  }
  .app{
    max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    gap:9px;padding:max(10px,env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
  }

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;flex:none}
  .brand{font-size:19px;color:var(--blue-d);text-shadow:1px 2px 0 #fff;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{flex-wrap:nowrap}
  .barL{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
  .acts{display:flex;gap:8px}
  .ico-btn{
    width:40px;height:40px;border:none;background:transparent;box-shadow:none;padding:0;
    font-size:21px;cursor:pointer;transition:.15s;line-height:1;opacity:.85;
  }
  .ico-btn:active{transform:scale(.88)}
  .ico-btn:hover{opacity:1}

  /* chips */
  .chips{display:flex;flex-wrap:nowrap;gap:6px;flex:none;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    background:#fff;border-radius:20px;padding:6px 10px;font-size:13px;color:var(--ink);
    box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;line-height:1.1;
    flex:none;white-space:nowrap;
  }
  .chip b{color:var(--blue-d)} .chip i{color:var(--ink-soft);font-style:normal;font-size:12px}
  .chip.alt{background:var(--blue);color:#fff}
  .daytoggle{display:inline-flex;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;flex:none}
  .daytoggle button{border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:13px;padding:6px 14px;cursor:pointer;line-height:1.1}
  .daytoggle button.on{background:var(--blue);color:#fff}
  .chip.tap{border:none;font-family:inherit;cursor:pointer}
  .chip.tap:active{transform:scale(.97)}
  .chip .swap{color:var(--chip);font-size:12px;margin-left:1px}
  /* 体质下拉：圆角胶囊，和其它 chip 统一 */
  .bodysel{flex:none;-webkit-appearance:none;appearance:none;
    font-family:inherit;font-size:13px;color:var(--ink);line-height:1.1;
    background-color:#fff;border:none;border-radius:20px;
    padding:6px 24px 6px 11px;box-shadow:var(--shadow);
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%234aa3e0" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>');
    background-repeat:no-repeat;background-position:right 9px center;background-size:10px 6px}

  /* collapsible edit sheet */
  .sheet{background:#fff;border-radius:18px;box-shadow:var(--shadow);display:none;flex:none}
  .sheet.open{display:block;padding:14px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field > label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:7px}
  .seg{display:flex;flex-wrap:wrap;gap:7px}
  .seg button{
    border:2px solid var(--line);background:#f4fbff;color:var(--ink);padding:8px 12px;
    border-radius:13px;font-family:inherit;font-size:13.5px;cursor:pointer;line-height:1;transition:.15s;
  }
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .temp-read{font-size:18px;color:var(--blue-d)}
  input[type=range]{width:100%;accent-color:var(--blue);height:26px}
  .slider-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft)}
  input[type=date]{border:2px solid var(--line);border-radius:11px;padding:7px 10px;font-family:inherit;font-size:14px;color:var(--ink);background:#f4fbff}
  .mini{font-size:12px;color:var(--ink-soft);margin:2px 0 1px}

  /* main: character (left) + outfit (right), pinned just under chips */
  .main{display:flex;gap:9px;flex:none;align-items:center}
  .stage{
    flex:1 1 50%;min-width:0;aspect-ratio:3/4;
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,#eafaff 0%,#dff4e9 100%);
    border-radius:22px;box-shadow:var(--shadow);border:2px solid #fff;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .stage .sky{position:absolute;top:8px;font-size:18px;opacity:.85;z-index:1}
  #sky1{left:10px} #sky2{right:10px}
  .ground{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:1;
    background:radial-gradient(120% 80% at 50% 100%,#bdebc6,transparent 70%)}
  .verdict-badge{position:absolute;top:8px;left:8px;z-index:3;
    background:var(--blue);color:#fff;font-size:12.5px;line-height:1.1;
    padding:5px 11px;border-radius:15px;box-shadow:var(--shadow)}
  #figure{height:100%;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:2;padding:5px}
  #figure img.kid{max-height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
  #figure svg{max-height:100%;width:auto;display:block}

  /* outfit: stacked right of character; emoji lives inside the label, no icon box */
  .outfit{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;gap:8px}
  .oc{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:9px 12px}
  .ok{font-size:13px;color:var(--ink-soft);margin-bottom:2px}
  .ov{font-size:13.5px;color:var(--blue-d);line-height:1.32;word-break:break-word}

  /* tips */
  .tips-head{flex:none;display:inline-flex;align-self:flex-start;align-items:center;gap:6px;
    background:var(--warn);color:#fff;border-radius:20px;padding:6px 14px;font-size:15px;box-shadow:var(--shadow);margin-top:2px}
  .tips{display:flex;flex-direction:column;gap:7px;flex:none}
  .tip{background:#fff;border:2px solid var(--line);border-radius:13px;padding:8px 11px;display:flex;gap:9px}
  .tip .ti{font-size:19px;flex:none}
  .tip .tt{font-size:13.5px;color:var(--blue-d);margin-bottom:1px}
  .tip .td{font-size:12px;color:var(--ink-soft);line-height:1.4}
  .tip.rain{background:#eef6ff;border-color:#cfe6ff}
  .tip.warm{background:#fff7ec;border-color:#ffe6c2}
  .tip.pollen{background:#fff8fb;border-color:#ffdcec}
  .tip.snow{background:#f1f8ff;border-color:#d7ecff}

  .wstatus{flex:none;font-size:12px;color:#2f6a96;text-align:center;min-height:14px}
  [hidden]{display:none!important}

  #loading{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(160deg,#bfe4fe 0%,#e3f4ff 40%,#eef9ff 100%);transition:opacity .35s ease}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .spin{width:40px;height:40px;border-radius:50%;border:4px solid #cfe6fb;border-top-color:var(--blue);animation:kgspin .8s linear infinite}
  #loading .lt{color:var(--blue-d);font-size:15px}
  @keyframes kgspin{to{transform:rotate(360deg)}}
  .tipmodal{position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;background:rgba(40,70,100,.4);padding:24px}
  .tipcard{background:#fff;border-radius:18px;padding:20px 22px;max-width:300px;box-shadow:var(--shadow);text-align:center}
  .tiptitle{font-size:17px;color:var(--blue-d);margin-bottom:10px}
  .tiptext{font-size:14px;color:var(--ink);line-height:1.7;margin-bottom:16px}
  .tipbtn{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:9px 24px;font-family:inherit;font-size:14px;cursor:pointer}
  #poster{position:fixed;left:-99999px;top:0;width:720px;background:linear-gradient(160deg,#cdebff,#eaf7ff);padding:26px;font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div class="lt">加载中…</div></div>
<div class="app">

  <div class="bar">
    <div class="brand" id="brand">幼儿园穿什么</div>
    <div class="acts">
      <button class="ico-btn" id="btnWeather" title="重新定位">🔄</button>
      <button class="ico-btn" id="btnShot" title="生成穿搭图卡">📸</button>
      <button class="ico-btn" id="btnInstall" title="添加到主屏幕">📲</button>
    </div>
  </div>

  <div class="chips">
    <select class="bodysel" id="bodySelect" aria-label="孩子体质">
      <option value="cold">🥶 怕冷</option>
      <option value="normal" selected>😊 标准</option>
      <option value="hot">🥵 怕热</option>
    </select>
    <button class="chip tap" id="dateChip" title="点击切换 今天/明天">📅 <span id="sDate">—</span> <i id="sWeek"></i> <span class="swap">⇆</span></button>
    <span class="chip"><span id="sWeatherEmo">⛅</span> <b id="sWeatherName">—</b></span>
    <span class="chip"><b><span id="sLow">–</span>~<span id="sHigh">–</span>℃</b></span>
  </div>

  <div class="main">
    <div class="stage">
      <span class="verdict-badge" id="sVerdict">—</span>
      <div class="ground"></div>
      <div id="figure"></div>
    </div>
    <div class="outfit" id="outfit"></div>
  </div>

  <div class="tips-head">🔔 明日提醒</div>
  <div class="tips" id="tips"></div>

  <div class="wstatus" id="wStatus"></div>
</div>
<div id="installTip" class="tipmodal" hidden>
  <div class="tipcard">
    <div class="tiptitle">📲 添加到主屏幕</div>
    <div class="tiptext" id="tipText"></div>
    <button class="tipbtn" id="tipClose">知道了</button>
  </div>
</div>
<div id="poster"></div>

<script>
/* ---------- recommendation engine ---------- */
function tierOf(high){
  if(high>=30) return 0;
  if(high>=26) return 1;
  if(high>=24) return 2;
  if(high>=17) return 3;
  if(high>=10) return 4;
  if(high>=5)  return 5;
  if(high>=0)  return 6;
  return 7;
}
const TIERNAME=['盛夏炎热','温暖舒适','春日舒适','凉爽','春寒/初秋','初冬微凉','寒冬','极寒'];

function recommend(s){
  const {high,low,weather,body,indoor}=s;
  const t=tierOf(high);
  const diff=high-low;
  const wet=(weather==='rain'||weather==='thunder');
  const snow=(weather==='snow');
  const sunnyHot=(weather==='sunny'&&high>=26);

  let inner, innerSvg;
  if(t===0){inner='短袖T恤';innerSvg='short';}
  else if(t===1){ if(low>=14&&body!=='cold'){inner='短袖T恤';innerSvg='short';} else {inner='长袖T恤';innerSvg='long';} }
  else if(t===2){ if(body==='hot'){inner='短袖T恤（怕热可换）';innerSvg='short';} else {inner='长袖T恤';innerSvg='long';} }
  else if(t===3){inner='长袖T恤';innerSvg='long';}
  else if(t===4){inner='普通秋衣 + 薄卫衣';innerSvg='thermal';}
  else if(t===5){inner='200g 纯棉秋衣 + 卫衣';innerSvg='thermal';}
  else if(t===6){inner='300g/德绒秋衣 + 摇粒绒';innerSvg='thermal';}
  else {inner='德绒厚秋衣 + 中厚摇粒绒';innerSvg='thermal';}

  const hasMid = (t>=4);

  let coat, coatSvg, hood=false;
  if(t===0){coat='轻薄防晒衣';coatSvg='sun';}
  else if(t<=3){coat='春夹克 / 风衣 / 牛仔外套';coatSvg='thin';}
  else if(t===4){coat='30g 羽绒 / 加绒冲锋衣';coatSvg='downL';}
  else if(t===5){coat='中厚羽绒服（充绒 90g）';coatSvg='downM';}
  else if(t===6){coat='厚羽绒服（充绒 100~110g）';coatSvg='downH';}
  else {coat='厚羽绒服（充绒 120~130g·95%绒）';coatSvg='downH';}

  let pants, pantsSvg;
  if(t===0){pants='防蚊裤（宽松透气）';pantsSvg='thin';}
  else if(t<=2){pants='薄运动裤 / 牛仔裤';pantsSvg='thin';}
  else if(t===3){pants='运动裤 / 软壳冲锋裤';pantsSvg='mid';}
  else if(t===4){pants='薄秋裤 + 长裤';pantsSvg='mid';}
  else if(t===5){pants='秋裤 + 防风裤';pantsSvg='thick';}
  else if(t===6){pants='德绒秋裤 + 加绒裤';pantsSvg='thick';}
  else {pants='德绒秋裤 + 加绒卫裤';pantsSvg='thick';}

  let shoes, shoesSvg;
  if(t===0){shoes='网眼袜 + 透气夏款运动鞋';shoesSvg='mesh';}
  else if(t<=4){shoes='薄棉袜 + 运动鞋';shoesSvg='sport';}
  else if(t===5){shoes='厚袜 + 防滑运动鞋';shoesSvg='winter';}
  else {shoes='纯棉厚袜 + 防滑保暖鞋';shoesSvg='winter';}

  let acc=[], hatSvg='none', scarf=false, gloves=false;
  if(t===0){acc.push('防晒帽');hatSvg='sun';}
  else if(t<=3){acc.push('棒球帽（按需）');hatSvg='cap';}
  else if(t===4){acc.push('棒球帽');hatSvg='cap';}
  else {acc.push('护耳毛线帽','针织围巾','保暖手套');hatSvg='wool';scarf=true;gloves=true;}

  if(wet){
    if(high>=12){coat='防雨风衣 / 冲锋衣';coatSvg='rain';}
    else{coat='防水羽绒服';hood=true;}
    pants= (high>=12?'防水运动裤':'加绒防风裤（防水）');
    shoes=shoes+' + 雨鞋备用';
    if(shoesSvg==='mesh')shoesSvg='sport';
    acc.unshift('便携雨衣 / 雨伞');
  }
  if(snow){
    coat='防水厚羽绒服';coatSvg='downH';hood=true;
    if(pantsSvg!=='thick')pantsSvg='thick';
    pants='加绒防风裤（防水）';
    shoes='纯棉厚袜 + 防滑雪地鞋';shoesSvg='winter';
    if(!gloves){gloves=true;}
    acc=['护耳毛线帽','针织围巾','防水手套'];hatSvg='wool';scarf=true;
  }

  let bodyNote='';
  if(body==='cold'&&t<=4){ acc.push('可加薄马甲'); bodyNote='怕冷宝贝：里面加件薄马甲，或下装换防风裤更稳妥。'; }
  if(body==='hot'){ bodyNote='怕热宝贝：午间升温可脱外套 / 换短袖，午休后可脱掉秋裤。'; }

  const topList=[{k:'里层',v:inner},{k:'外套',v:coat}];
  const layers = (hasMid?3:2);

  const tips=[];
  if(weather==='thunder')tips.push({c:'rain',i:'⛈️',t:'雷阵雨',d:'山区/午后易有雷阵雨，备好雨衣雨伞，避开积水路面，防止鞋子进水着凉。'});
  else if(weather==='rain')tips.push({c:'rain',i:'🌧️',t:'有雨',d:'出行备雨衣或雨伞；雨天气温偏低，外套挡风防雨，避开积水。'});
  if(snow)tips.push({c:'snow',i:'🌨️',t:'雪天路滑',d:'路面易滑，接送提早慢行；衣物选防水面料，戴防水手套保暖。'});
  if(sunnyHot)tips.push({c:'warm',i:'🧴',t:'防晒补水',d:'正午阳光强烈，做好防晒（防晒帽/冰袖），户外活动及时补水，避免闷热出汗。'});
  if(weather==='windy')tips.push({c:'rain',i:'💨',t:'大风防风',d:'风力较大，外套拉好拉链防风，帽子可放书包备用，以免被风吹跑。'});
  if(t<=2)tips.push({c:'warm',i:'🧥',t:'机动外套',d:'早晚凉、午间热，进教室或午间升温可脱外套，按孩子体感灵活增减。'});
  else if(t<=4)tips.push({c:'warm',i:'🦺',t:'保暖小贴士',d:'早上进教室脱外套，可加件薄马甲；午间升温热了再脱掉，灵活增减。'});
  else tips.push({c:'warm',i:'🧥',t:'室内脱外套',d:'室内开暖气，进教室脱羽绒服；围巾手套午间阳光足时可灵活脱卸，避免捂汗。'});
  if(diff>=9)tips.push({c:'',i:'🌡️',t:'昼夜温差大',d:`温差约 ${diff}℃，早晚凉、午间暖，靠脱穿外套这一“机动层”应对，按孩子体感增减。`});
  if(t>=5)tips.push({c:'',i:'🏫',t:'看教室室温',d:`室内 ${indoor}℃ ${indoor>=22?'偏暖→里层选纯棉秋衣即可':'偏凉→里层建议换德绒/加厚秋衣'}；孩子在园待最久，按教室温度定打底厚薄。`});
  const m=s.month;
  if(high>=8&&!snow){
    if([3,4,5].includes(m))tips.push({c:'pollen',i:'🌼',t:'花粉/柳絮多',d:'花粉浓度偏高，过敏儿童注意防护，少去花丛树下，外出可戴口罩。'});
    else if([6,9,10].includes(m))tips.push({c:'pollen',i:'🌼',t:'花粉提醒',d:'花粉浓度低到中等，过敏儿童注意防护。'});
  }
  if(bodyNote)tips.push({c:'',i: body==='cold'?'🥶':'🥵',t: body==='cold'?'怕冷方案':'怕热方案',d:bodyNote});

  return {
    tier:t, name:TIERNAME[t], layers, topList, pants, shoes, acc,
    svg:{top:innerSvg, coat:coatSvg, pants:pantsSvg, shoes:shoesSvg, hat:hatSvg, scarf, gloves, hood, bag:s.bag},
    tips,
    verdictSub:`洋葱式 ${layers} 层 · ${t===0?'防晒防蚊':(t<=4?'早晚加外套':'羽绒保暖')}`
  };
}

/* ---------- SVG figure (fallback) ---------- */
const COLORS={
  skin:'#ffe0c2', skinD:'#f3c9a4', hair:'#6b4a2b', hairD:'#5a3d22',
  tee:'#ffffff', thermal:'#fff1e2',
  sun:'#dcefff', thin:'#8fd0f0', downL:'#86c8f0', downM:'#4f9fda', downH:'#357fc2', rain:'#ffce3a',
  thin_p:'#bfa9e6', mid_p:'#8a78c8', thick_p:'#46527e',
  scarf:'#ff7a99', glove:'#ff9ec4', wool:'#f0779b', cap:'#4aa3e0', sunhat:'#ffe08a',
  bag:'#5fb84a', bagS:'#ff9a4d'
};
function fig(v){
  const C=COLORS;
  let s=`<svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg">`;
  if(v.bag){
    s+=`<rect x="78" y="205" width="34" height="70" rx="14" fill="${C.bag}"/>
        <rect x="86" y="222" width="18" height="22" rx="6" fill="${C.bagS}"/>`;
  }
  s+=`<ellipse cx="150" cy="92" rx="60" ry="58" fill="${C.hair}"/>
      <circle cx="92" cy="108" r="20" fill="${C.hair}"/>
      <circle cx="208" cy="108" r="20" fill="${C.hair}"/>
      <circle cx="92" cy="86" r="6" fill="${C.wool}"/>
      <circle cx="208" cy="86" r="6" fill="${C.wool}"/>`;
  s+=`<circle cx="150" cy="100" r="48" fill="${C.skin}"/>`;

/* ---------- real-time weather (Open-Meteo, no key) ---------- */
function codeToWeather(c){
  if(c===0)return 'sunny';
  if(c===1||c===2)return 'cloudy';
  if(c===3||c===45||c===48)return 'overcast';
  if([95,96,99].includes(c))return 'thunder';
  if([71,73,75,77,85,86].includes(c))return 'snow';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))return 'rain';
  return 'cloudy';
}
const BEIJING={lat:39.9042, lon:116.4074, name:'北京'};
function getCoords(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude, lon:p.coords.longitude}),
      ()=>resolve(null),
      {timeout:7000, maximumAge:600000, enableHighAccuracy:false}
    );
  });
}
async function fetchWeatherAt(lat,lon,name){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    +'&daily=temperature_2m_max,temperature_2m_min,weathercode,windspeed_10m_max'
    +'&timezone=auto&forecast_days=2';
  const res=await fetch(url); if(!res.ok)throw 0;
  const j=await res.json(); const d=j.daily;
  const mk=(i)=>{
    let w=codeToWeather(d.weathercode[i]);
    if(w==='sunny'&&d.windspeed_10m_max&&d.windspeed_10m_max[i]>=35)w='windy';
    return {hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),
            w,date:new Date(d.time[i]+'T00:00:00'),dateStr:d.time[i]};
  };
  DAYS[0]=mk(0); DAYS[1]=mk(1);
  applyDay();
  setCachedDays(name);
  const dd=DAYS[state.day==='today'?0:1];
  document.getElementById('wStatus').textContent=`✅ ${name} ${dd.date.getMonth()+1}月${dd.date.getDate()}日 实时预报`;
}
// 位置缓存（localStorage）
const LOC_KEY='kg_loc';
function getCachedLoc(){ try{ return JSON.parse(localStorage.getItem(LOC_KEY)||'null'); }catch(e){ return null; } }
function setCachedLoc(o){ try{ localStorage.setItem(LOC_KEY, JSON.stringify(o)); }catch(e){} }
// 缓存上次天气数据，离线时仍能显示
const DAYS_KEY='kg_days';
function setCachedDays(name){ try{ localStorage.setItem(DAYS_KEY, JSON.stringify({name, days:DAYS.map(d=>({hi:d.hi,lo:d.lo,w:d.w,dateStr:d.dateStr}))})); }catch(e){} }
function getCachedDays(){ try{ const o=JSON.parse(localStorage.getItem(DAYS_KEY)||'null'); if(!o)return null; o.days=o.days.map(d=>({...d,date:new Date(d.dateStr+'T00:00:00')})); return o; }catch(e){ return null; } }

// 初始：有缓存用缓存，否则北京（不弹定位）
async function initWeather(){
  const loc = getCachedLoc() || {lat:BEIJING.lat, lon:BEIJING.lon, name:'北京'};
  try{ await fetchWeatherAt(loc.lat, loc.lon, loc.name); }
  catch(e){
    // 离线：用上次缓存的天气数据继续显示
    const cd=getCachedDays();
    if(cd){ DAYS=cd.days; applyDay(); document.getElementById('wStatus').textContent='📦 离线 · 显示上次数据（'+cd.name+'）'; }
    else{ document.getElementById('wStatus').textContent='⚠️ 天气获取失败，点 🔄 重试'; }
  }
}
// 🔄 重新定位（请求一次定位，成功则缓存并使用）
async function relocate(){
  const st=document.getElementById('wStatus');
  st.textContent='⏳ 正在定位…';
  const c=await getCoords();
  if(c){
    const loc={lat:c.lat, lon:c.lon, name:'📍我的位置'};
    setCachedLoc(loc);
    try{ await fetchWeatherAt(loc.lat, loc.lon, loc.name); return; }
    catch(e){ st.textContent='⚠️ 天气获取失败，请检查网络'; return; }
  }
  // 定位失败/被拒 → 回退（有缓存用缓存，否则北京）
  const loc = getCachedLoc() || {lat:BEIJING.lat, lon:BEIJING.lon, name:'北京'};
  try{ await fetchWeatherAt(loc.lat, loc.lon, loc.name); st.textContent='📍 未获取到定位，已用'+loc.name; }
  catch(e){ st.textContent='⚠️ 天气获取失败，请检查网络'; }
}

// 按需加载截图库（只在点 📸 时才下载，不拖慢打开）
function ensureH2C(){
  return new Promise((resolve,reject)=>{
    if(window.html2canvas) return resolve();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>resolve(); s.onerror=reject;
    document.head.appendChild(s);
  });
}
async function makeShot(){
  const st=document.getElementById('wStatus');
  st.textContent='⏳ 正在准备图卡…';
  try{ await ensureH2C(); }catch(_){ st.textContent='⚠️ 截图组件加载失败（需联网）'; return; }
  const r=recommend({...state,month:state.date.getMonth()+1});
  const host=document.getElementById('poster');
  host.innerHTML=buildPoster(r);
  host.querySelectorAll('img.kid').forEach(i=>i.style.cssText='display:block;width:100%;max-width:200px;height:auto;margin:0 auto');
  st.textContent='⏳ 正在生成图卡…';
  try{
    await Promise.all([...host.querySelectorAll('img')].map(img=>img.complete?1:new Promise(r=>{img.onload=img.onerror=r;})));
    await new Promise(res=>setTimeout(res,120));
    const canvas=await html2canvas(host,{scale:2,backgroundColor:null,logging:false,useCORS:true});
    canvas.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`幼儿园穿搭_${state.date.getMonth()+1}月${state.date.getDate()}日.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      st.textContent='✅ 图卡已保存到「下载」，可发群/朋友圈';
    },'image/png');
  }catch(e){ st.textContent='⚠️ 生成失败，请重试'; }
}
document.getElementById('btnShot').onclick=makeShot;

// 等当前小人图就绪后揭开遮罩（小人图已被 SW 缓存，几乎瞬间）
async function reveal(){
  const img=document.querySelector('#figure img.kid');
  if(img && !img.complete){ await new Promise(res=>{ img.onload=img.onerror=res; setTimeout(res,2000); }); }
  document.getElementById('loading').classList.add('hide');
}
// 启动：有上次缓存就「先秒显示、后台静默刷新」；没有则正常加载
(async()=>{
  const cached=getCachedDays();
  if(cached){
    DAYS=cached.days; applyDay();                     // 用缓存立刻渲染
    document.getElementById('wStatus').textContent='📦 '+cached.name+' · 刷新中…';
    await reveal();                                    // 立刻揭开
    initWeather();                                     // 后台静默拉最新（成功更新/失败保持缓存）
  } else {
    try{ await initWeather(); }catch(e){}
    if(!document.getElementById('figure').children.length) render();
    await reveal();
  }
})();

// 注册 Service Worker（PWA：可添加到主屏幕、离线可看上次内容）
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

// 「添加到主屏幕」按钮
(function(){
  const btn=document.getElementById('btnInstall');
  const tip=document.getElementById('installTip');
  const tipText=document.getElementById('tipText');
  // 已经是安装后的独立窗口 → 不需要再显示安装按钮
  if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone){ btn.style.display='none'; return; }
  let dp=null;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); dp=e; });
  window.addEventListener('appinstalled', ()=>{ btn.style.display='none'; });
  btn.onclick=async()=>{
    if(dp){ dp.prompt(); try{ await dp.userChoice; }catch(e){} dp=null; return; }   // 安卓/Chrome：系统安装框
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    tipText.innerHTML = ios
      ? 'iPhone / iPad（Safari）：<br>点底部「分享」⬆️ → 选「添加到主屏幕」'
      : '点浏览器右上「⋮」菜单 → <br>选「添加到主屏幕 / 安装应用」';
    tip.hidden=false;
  };
  document.getElementById('tipClose').onclick=()=>{ tip.hidden=true; };
  tip.onclick=(e)=>{ if(e.target===tip) tip.hidden=true; };
})();
</script>
